<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSC649: self-study pages</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2A2E;--muted:#56676C;--paper:#F5F8F8;--panel:#FFFFFF;--line:#D6E2E3;--brand:#0E6E73;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--ink:#E4EEEF;--muted:#A3B6B9;--paper:#121C1E;--panel:#1B282B;--line:#2E4246;--brand:#5CC2C7;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",Arial,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:48px 24px}
h1{font-size:38px;line-height:1.15;margin:0 0 10px} p{color:var(--muted)}
ul{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;gap:12px}
li a{display:flex;justify-content:space-between;gap:16px;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-decoration:none}
li a:hover{border-color:var(--brand)} a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CSC649 self-study pages</h1>
  <p>Interactive pages to use during and after the lecture. Exercises are for practice and do not need to be submitted.</p>

</div>
